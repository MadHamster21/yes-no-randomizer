<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yes/No Randomizer — Play Store upload workspace</title>
    <link rel="stylesheet" href="../../gallery.css">
</head>
<body data-locale="ja-JP">
<main>
    <h1>Play Store upload workspace</h1>
    <p>Choose a language, copy the listing text, then upload the images from its folder.</p>
    <nav>
        <label for="locale">Listing language</label><select id="locale"></select>
        <a id="locale-page">Open this language’s page</a>
        <a id="bundle" download>Download this language</a>
        <a id="all-bundles" download>Download everything</a>
        <a href="#phone" id="jump-phone">Phone images</a>
        <a href="#tablet" id="jump-tablet">Tablet images</a>
    </nav>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="listing"></section>
</main>
<script src="../../data.js"></script>
<script src="../../gallery.js"></script>
</body>
</html>
